<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>J.A.R.V.I.S. AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05060f">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#05060f; --panel:rgba(12,20,60,.75); --line:#2b4a9a;
  --blue:#2fa8ff; --pink:#ff3fd8; --text:#e6f1ff; --dim:#7b8fc0;
  --state:#6ac8ff; --glow:rgba(110,120,255,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 85% 25%,rgba(255,63,216,.20),transparent 50%),
    radial-gradient(circle at 12% 25%,rgba(47,168,255,.22),transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Roboto,Tahoma,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
h1{
  margin:4px 0 0;font-size:24px;letter-spacing:.45em;padding-left:.45em;font-weight:800;
  background:linear-gradient(90deg,var(--blue),#a77bff 50%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#status{margin:2px 0 6px;font-size:12px;letter-spacing:.3em;color:var(--state);min-height:16px;transition:color .3s}

/* ---------- AI tech background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(63,184,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(63,184,255,.09) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 15%,transparent 75%);
  mask-image:radial-gradient(circle at 50% 30%,#000 15%,transparent 75%);
}
body::after{
  content:"";position:fixed;left:0;right:0;top:-12%;height:12%;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(63,184,255,.12),transparent);
  animation:sweep 7s linear infinite;
}
@keyframes sweep{to{transform:translateY(900%)}}
.ringS{stroke:var(--state);transition:stroke .3s}

/* ---------- Scene ---------- */
#app{width:min(460px,100%);position:relative}
#scene{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 16px var(--glow));transition:filter .3s}

/* eyes */
.eyeL,.eyeR{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.eyeR{animation-delay:.05s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
.glowL{filter:drop-shadow(0 0 4px #2f7bff)}
.glowR{filter:drop-shadow(0 0 5px #ff2fd2)}

/* mouth */
.mouthOpen{transform-box:fill-box;transform-origin:center;transform:scaleY(.08);transition:transform .1s}
.talking .mouthOpen{animation:talk .2s infinite alternate ease-in-out}
@keyframes talk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}

/* seam, led, scan */
.seam{stroke:var(--state);stroke-width:1.6;filter:drop-shadow(0 0 4px var(--state));transition:stroke .3s}
.led{fill:var(--state);filter:drop-shadow(0 0 5px var(--state));transition:fill .3s}
.scan{opacity:0}
.listening .scan,.thinking .scan{opacity:.85;animation:scan 1.5s linear infinite}
@keyframes scan{from{transform:translateY(-14px)}to{transform:translateY(190px)}}

/* dashboard animation */
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.2s ease-in-out infinite alternate}
.bar:nth-child(2n){animation-duration:1.6s}
.bar:nth-child(3n){animation-duration:2.8s}
@keyframes bar{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.eq rect{transform-box:fill-box;transform-origin:bottom;animation:bar 1.3s ease-in-out infinite alternate}
.eq rect:nth-child(2n){animation-duration:.9s}
.eq rect:nth-child(3n){animation-duration:1.7s}
.talking .eq rect{animation-duration:.28s}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spin.rev{animation-duration:20s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* states */
.listening{--state:#ff4d5e;--glow:rgba(255,77,94,.55)}
.thinking{--state:#ffb020;--glow:rgba(255,176,32,.5)}
.talking{--state:#4dffb4;--glow:rgba(77,255,180,.5)}
.thinking .eyeL,.thinking .eyeR{animation:flick .3s infinite alternate}
@keyframes flick{from{opacity:1}to{opacity:.3}}

/* ---------- Text + controls ---------- */
#heard{font-size:13px;color:var(--dim);min-height:18px;margin-top:8px;max-width:560px;text-align:center}
#reply{font-size:18px;line-height:1.45;max-width:560px;min-height:54px;margin:6px 0 10px;text-align:center}
.controls{display:flex;gap:8px;width:100%;max-width:560px}
#msg{
  flex:1;min-width:0;padding:13px 14px;border-radius:10px;font:inherit;font-size:16px;
  background:var(--panel);color:var(--text);border:1px solid var(--line);outline:none;
}
#msg:focus{border-color:var(--blue)}
button{
  font:inherit;font-weight:700;font-size:15px;padding:12px 15px;border-radius:10px;cursor:pointer;
  background:var(--panel);color:var(--text);border:1px solid var(--line);transition:.15s;
}
button:hover{border-color:var(--blue)}
button:active{transform:scale(.97)}
button:focus-visible,#msg:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#send{background:linear-gradient(90deg,#2a6bff,#8f3dff);border-color:transparent;color:#fff}
#mic{background:linear-gradient(90deg,#ff3fd8,#ff7a59);border-color:transparent;color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;max-width:560px}
.opts button{font-size:13px;padding:8px 12px;font-weight:600}
.opts button.on{border-color:var(--blue);color:var(--blue)}
#installBtn{background:linear-gradient(90deg,#00c853,#64dd17);color:#fff;border:none;display:none;}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  <!-- Face (fades out at the shoulders) -->

<div id="heard"></div>
<div id="reply">Systems online, Boss. Bolo, main sun raha hoon.</div>

<div class="controls">
  <input id="msg" placeholder="Type a command..." autocomplete="off" enterkeyhint="send">
  <button id="send">Send</button>
  <button id="mic">🎙 Speak</button>
  <button id="stop">Stop</button>
</div>

<div class="opts">
  <button id="settingsBtn" title="API Key Settings">🔑 API Keys</button>
  <button id="langBtn" title="Mic language">🌐 Mic: Hinglish</button>
  <button id="autoBtn" title="Auto listen again after reply">🔁 Auto Mic: OFF</button>
  <button id="voiceBtn" title="Check voice output">🔊 Test Voice</button>
  <button id="clearBtn" title="Forget conversation">🧹 Reset Chat</button>
  <button id="installBtn" title="Install App">📲 Install App</button>
</div>

<!-- API Key Settings Modal (Placed BEFORE scripts) -->
<div id="settingsModal" style="display:none; position:fixed; inset:0; background:rgba(5,6,15,0.85); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
  <div style="background:var(--panel); border:1px solid var(--blue); border-radius:14px; padding:20px; max-width:420px; width:100%; color:var(--text); box-shadow:0 0 20px var(--glow);">
    <h2 style="margin-top:0; font-size:20px; color:var(--blue); text-align:center;">⚙️ API Settings</h2>
    <p style="font-size:13px; color:var(--dim); line-height:1.4; margin-bottom:16px;">
      Aap yahan apni Groq ya Gemini API Key save kar sakte hain. Keys aapke browser ke local storage me safe rahengi.
    </p>
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:12px; margin-bottom:4px; font-weight:bold;">Groq API Key:</label>
      <input id="groqKeyInput" type="password" placeholder="gsk_..." style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#05060f; color:#fff;">
    </div>
    <div style="margin-bottom:18px;">
      <label style="display:block; font-size:12px; margin-bottom:4px; font-weight:bold;">Gemini API Key:</label>
      <input id="geminiKeyInput" type="password" placeholder="AIzaSy..." style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#05060f; color:#fff;">
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button id="closeSettingsBtn" style="background:transparent; border:1px solid var(--dim); color:var(--dim);">Close</button>
      <button id="saveSettingsBtn" style="background:linear-gradient(90deg,#2a6bff,#8f3dff); border:none; color:#fff;">Save Keys</button>
    </div>

<script>
/* =====================================================
   🔑 API KEYS SETTINGS
   ===================================================== */
const GROQ_API_KEY   = "PASTE_YOUR_NEW_GROQ_API_KEY_HERE";
const GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";

const PRIMARY = "groq";                           // "groq" ya "gemini"
const GROQ_MODEL   = "llama-3.3-70b-versatile";   // fast: "llama-3.1-8b-instant"
const GEMINI_MODEL = "gemini-2.5-flash";          // ya "gemini-2.5-flash-lite"
const MAX_TOKENS = 500;
const HISTORY_LIMIT = 12;                         // last N messages remembered

/* 🤖 ROBOTIC MALE VOICE SETTINGS */
const VOICE_PITCH = 0.55;   // 0.1 - 2  (kam = bhari/robotic)
const VOICE_RATE  = 0.93;   // 0.5 - 2  (kam = dheere, mechanical)

/* ---------------- error reporter ---------------- */
window.addEventListener('error', e => {
  const r = document.getElementById('reply');
  if (r) r.textContent = 'JS error: ' + e.message;
});

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const app = $('app');
let chatHistory = [];
let speaking = false, thinking = false, listening = false;
let recog = null;
let autoMic = false;
let micLang = 'hi-IN';           // Hinglish / Hindi
let speakToken = 0;

const CODE_KEYS = {groq: GROQ_API_KEY, gemini: GEMINI_API_KEY};
function getKey(p){
  const localKey = localStorage.getItem('jarvis_' + p + '_key') || '';
  if (localKey.trim()) return localKey.trim();
  const k = (CODE_KEYS[p] || '').trim();
  return (k && !k.includes('PASTE_YOUR')) ? k : '';
}
function hasAnyKey(){ return !!(getKey('groq') || getKey('gemini')); }

function setState(s){
  app.className = s || '';
  const map = {listening:'LISTENING...', thinking:'PROCESSING...', talking:'SPEAKING...'};
  $('status').textContent = map[s] || 'ONLINE';
}
function refreshState(){
  setState(speaking ? 'talking' : thinking ? 'thinking' : listening ? 'listening' : '');
}

/* ---------------- voice output (robotic male) ---------------- */
const FEMALE = /female|woman|zira|heera|neerja|swara|samantha|karen|susan|hazel|priya|veena|kalpana|aria|jenny|sonia|libby|natasha|moira|tessa|fiona|lekha|kanya|aditi/i;
const MALE   = /male|man|david|mark|guy|ravi|prabhat|madhur|rishi|hemant|daniel|george|james|ryan|alex|thomas|brian|christopher|eric|liam|arthur|oliver/i;

function pickVoice(hindi){
  if (!('speechSynthesis' in window)) return null;
  const all = speechSynthesis.getVoices();
  const pool = all.filter(v => v.lang.toLowerCase().startsWith(hindi ? 'hi' : 'en'));
  if (!pool.length) return null;
  let best = null, bestScore = -1;
  for (const v of pool){
    const l = v.lang.toLowerCase();
    let sc = 0;
    if (MALE.test(v.name) && !/female/i.test(v.name)) sc += 10;
    if (!FEMALE.test(v.name)) sc += 4;
    if (!hindi){ if (l.startsWith('en-in') || l === 'en_in') sc += 3; else if (l.includes('gb')) sc += 2; else if (l.includes('us')) sc += 1; }
    if (/google|natural|online/i.test(v.name)) sc += 1;
    if (sc > bestScore){ bestScore = sc; best = v; }
  }
  return best;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

function stripMarkdown(t){
  return t.replace(/[*_`#>~]/g,'').replace(/https?:\/\/\S+/g,'link').replace(/\s+/g,' ').trim();
}
function splitChunks(t){
  const parts = t.match(/[^.!?।,;:]+[.!?।,;:]*/g) || [t];
  const out = [];
  let buf = '';
  for (const p of parts){
    buf += p;
    if (buf.trim().length >= 12){ out.push(buf.trim()); buf = ''; }
  }
  if (buf.trim()) { if (out.length) out[out.length-1] += ' ' + buf.trim(); else out.push(buf.trim()); }
  return out;
}

function say(show, after, speakText){
  $('reply').textContent = show;
  if (!('speechSynthesis' in window)){
    $('heard').textContent = 'Is browser me bolne wali voice nahi hai. Chrome me kholo.';
    if (after) after();
    return;
  }
  const token = ++speakToken;
  speechSynthesis.cancel();
  const chunks = splitChunks(stripMarkdown(speakText || show));
  let remaining = chunks.length;
  const finish = () => {
    if (token !== speakToken) return;
    speaking = false; refreshState();
    if (after) after();
  };
  setTimeout(() => {
    if (token !== speakToken) return;
    chunks.forEach((c, idx) => {
      const hindi = /[ऀ-ॿ]/.test(c);
      const u = new SpeechSynthesisUtterance(c);
      const v = pickVoice(hindi);
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = hindi ? 'hi-IN' : 'en-IN';
      u.pitch = VOICE_PITCH; u.rate = VOICE_RATE; u.volume = 1;
      if (idx === 0) u.onstart = () => { if (token === speakToken){ speaking = true; refreshState(); } };
      u.onend = () => { if (token !== speakToken) return; if (--remaining <= 0) finish(); };
      u.onerror = ev => {
        if (token !== speakToken) return;
        const err = ev && ev.error;
        if (err && err !== 'interrupted' && err !== 'canceled') $('heard').textContent = 'Voice error: ' + err;
        if (--remaining <= 0) finish();
      };
      speechSynthesis.speak(u);
    });
  }, 60);
}

function stopAll(){
  speakToken++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (recog){ try{ recog.abort(); }catch(e){} }
  speaking = false; listening = false; thinking = false;
  autoMic = false; $('autoBtn').textContent = '🔁 Auto Mic: OFF'; $('autoBtn').classList.remove('on');
  refreshState();
}

/* ---------------- AI brain (Groq + Gemini) ---------------- */
const SYSTEM_PROMPT =
  "You are JARVIS, an advanced AI butler in the style of Tony Stark's assistant: calm, witty, precise, loyal. "+
  "Address the user as 'Boss'. You understand English, Hindi and Hinglish perfectly. "+
  "Reply in the language the user used: English question -> English reply; Hindi or Hinglish -> natural, fluent Hinglish. "+
  "Keep it brief: 1 to 3 short sentences, because it is spoken aloud. No markdown, no emojis, no lists. "+
  "OUTPUT FORMAT, exactly two lines and nothing else:
"+
  "SHOW: <your reply. Hinglish must be written in Roman letters>
"+
  "SAY: <the same reply for the voice engine: Hindi words in Devanagari script, English words in Latin letters. "+
  "If the reply is fully English, SAY is identical to SHOW>
"+
  "Example for Hinglish:
"+
  "SHOW: Boss, aaj mausam bahut accha hai, bahar chalein?
"+
  "SAY: Boss, आज मौसम बहुत अच्छा है, बाहर चलें?";

function parseReply(raw){
  const clean = raw.trim();
  const mShow = clean.match(/SHOW:\s*([\s\S]*?)(?:
\s*SAY:|$)/i);
  const mSay  = clean.match(/SAY:\s*([\s\S]*)$/i);
  const show = (mShow && mShow[1].trim()) || clean.replace(/^SAY:\s*/i,'').trim();
  const sayT = (mSay && mSay[1].trim()) || show;
  return {show, say: sayT};
}

async function callGroq(key){
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
    body: JSON.stringify({
      model: GROQ_MODEL, max_tokens: MAX_TOKENS, temperature: 0.7,
      messages:[{role:'system', content:SYSTEM_PROMPT}, ...chatHistory]
    })
  });
  const data = await res.json();
  const text = data.choices && data.choices[0] && data.choices[0].message.content;
  if (text) return {ok:true, text:text.trim()};
  return {ok:false, status:res.status, err:(data.error && data.error.message) || 'empty response'};
}

async function callGemini(key, noThinkingCfg){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent';
  const gen = {maxOutputTokens: MAX_TOKENS + 300, temperature: 0.7};
  if (!noThinkingCfg) gen.thinkingConfig = {thinkingBudget: 0};
  const res = await fetch(url,{
    method:'POST',
    headers:{'x-goog-api-key':key,'Content-Type':'application/json'},
    body: JSON.stringify({
      systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},
      contents: chatHistory.map(m => ({role: m.role==='assistant' ? 'model' : 'user', parts:[{text:m.content}]})),
      generationConfig: gen
    })
  });
  const data = await res.json();
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  const text = parts && parts.map(p => p.text || '').join('').trim();
  if (text) return {ok:true, text};
  if (!noThinkingCfg && res.status === 400) return callGemini(key, true);
  return {ok:false, status:res.status, err:(data.error && data.error.message) || 'empty response'};
}

const PROVIDERS = {groq:callGroq, gemini:callGemini};

async function askBrain(prompt){
  if (!hasAnyKey())
    return {show:"Boss, API key missing hai. Neeche 'API Keys' button dabakar key daalo.", say:"Boss, API key missing hai. Key set karo."};

  thinking = true; refreshState();
  chatHistory.push({role:'user', content:prompt});
  if (chatHistory.length > HISTORY_LIMIT) chatHistory = chatHistory.slice(-HISTORY_LIMIT);

  const order = [PRIMARY, PRIMARY === 'groq' ? 'gemini' : 'groq'];
  let lastErr = '';
  try{
    for (const name of order){
      const key = getKey(name);
      if (!key) continue;
      try{
        const r = await PROVIDERS[name](key);
        if (r.ok){
          chatHistory.push({role:'assistant', content:r.text});
          return parseReply(r.text);
        }
        lastErr = name + ' ' + r.status + ': ' + r.err;
        console.warn('Provider failed', lastErr);
      }catch(e){
        lastErr = name + ': network/CORS error - ' + e.message;
        console.warn('Provider error', name, e);
      }
    }
    chatHistory.pop();
    return {show:"Boss, AI core fail ho gaya. Key ya internet check karo. (" + lastErr + ")", say:"Boss, AI core fail ho gaya. Key ya internet check karo."};
  }finally{
    thinking = false; refreshState();
  }
}

/* ---------------- commands ---------------- */
const SITES = {
  youtube:'https://m.youtube.com', google:'https://www.google.com', gmail:'https://mail.google.com',
  whatsapp:'https://web.whatsapp.com', instagram:'https://www.instagram.com',
  facebook:'https://www.facebook.com', maps:'https://maps.google.com'
};

async function respond(text){
  const q = text.toLowerCase();

  if (/(time|samay|baje|kitne baj)/.test(q)){
    const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    return say('Boss, abhi time hai ' + t, afterTurn);
  }
  if (/(date|tarikh|aaj kya din)/.test(q)){
    const d = new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    return say('Boss, aaj ki date hai ' + d, afterTurn);
  }
  if (/(open|kholo|khol do|chalao|chala do)/.test(q)){
    for (const name in SITES){
      if (q.includes(name)){
        say('Opening ' + name + ', Boss.', afterTurn);
        window.open(SITES[name], '_blank');
        return;
      }
    }
  }
  if (/^(search|google|dhundo|search karo)/.test(q)){
    const term = text.replace(/^(search karo|search|google|dhundo)\s*/i,'');
    if (term){
      say('Searching ' + term + ', Boss.', afterTurn);
      window.open('https://www.google.com/search?q=' + encodeURIComponent(term), '_blank');
      return;
    }
  }

  const r = await askBrain(text);
  say(r.show, afterTurn, r.say);
}

function afterTurn(){ if (autoMic) setTimeout(listen, 400); }

function send(){
  const text = $('msg').value.trim();
  if (!text) return;
  $('msg').value = '';
  $('heard').textContent = 'You: ' + text;
  respond(text);
}

/* ---------------- voice input ---------------- */
function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ say('Is browser me voice input nahi hai. Chrome ya Edge use karo, ya type karo.'); return; }
  if (listening) return;
  speakToken++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false;

  recog = new SR();
  recog.lang = micLang;
  recog.interimResults = true;
  recog.maxAlternatives = 1;
  let finalText = '';

  recog.onstart = () => { listening = true; refreshState(); };
  recog.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    $('heard').textContent = 'You: ' + (finalText || interim);
  };
  recog.onerror = ev => {
    listening = false; refreshState();
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      autoMic = false;
      say('Microphone blocked hai. Chrome me mic permission allow karo, aur file Chrome me hi kholo.');
    } else if (ev.error === 'no-speech'){
      $('heard').textContent = 'Kuch sunai nahi diya.';
    } else if (ev.error !== 'aborted'){
      $('heard').textContent = 'Mic error: ' + ev.error;
    }
  };
  recog.onend = () => {
    listening = false; refreshState();
    const t = finalText.trim();
    if (t) respond(t);
    else if (autoMic && !speaking && !thinking) setTimeout(listen, 600);
  };
  try{ recog.start(); }catch(e){ listening = false; refreshState(); }
}

/* ---------------- voice unlock + test ---------------- */
let speechUnlocked = false;
function unlockSpeech(){
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener('pointerdown', unlockSpeech);
document.addEventListener('keydown', unlockSpeech);

$('voiceBtn').onclick = () => {
  if (!('speechSynthesis' in window)){
    $('heard').textContent = 'Voice supported nahi hai is browser me. Chrome use karo.';
    return;
  }
  const n = speechSynthesis.getVoices().length;
  $('heard').textContent = 'Voices mili: ' + n + (n ? '' : ' (phone Settings me Text-to-speech install karo)');
  say('Hello Boss. Main Jarvis hoon, aapka personal AI assistant.', null,
      'Hello Boss. मैं JARVIS हूँ, आपका personal AI assistant.');
};

/* ---------------- AI tech background ---------------- */
(function(){
  const cv = document.getElementById('bg'); if (!cv || !cv.getContext) return;
  const cx = cv.getContext('2d');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, pts = [], dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  function init(){
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(28, Math.min(70, Math.round(W * H / 15000)));
    pts = Array.from({length:n}, (_, i) => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .8, pink: i % 3 === 0
    }));
  }
  function frame(){
    cx.clearRect(0, 0, W, H);
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    const maxD = 120;
    for (let i = 0; i < pts.length; i++){
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++){
        const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if (d < maxD){
          cx.strokeStyle = (a.pink || b.pink ? 'rgba(255,63,216,' : 'rgba(63,184,255,') + ((1 - d / maxD) * .35).toFixed(3) + ')';
          cx.lineWidth = .8;
          cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
        }
      }
    }
    for (const p of pts){
      cx.fillStyle = p.pink ? 'rgba(255,120,230,.9)' : 'rgba(120,210,255,.9)';
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
    if (!still && !document.hidden) requestAnimationFrame(frame);
  }
  init(); frame();
  addEventListener('resize', () => { init(); if (still) frame(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !still) frame(); });
})();

/* ---------------- UI wiring ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  if ($('send')) $('send').onclick = send;
  if ($('msg')) $('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  if ($('mic')) $('mic').onclick = listen;
  if ($('stop')) $('stop').onclick = stopAll;
  if ($('langBtn')) $('langBtn').onclick = () => {
    micLang = micLang === 'hi-IN' ? 'en-IN' : 'hi-IN';
    $('langBtn').textContent = '🌐 Mic: ' + (micLang === 'hi-IN' ? 'Hinglish' : 'English');
  };
  if ($('autoBtn')) $('autoBtn').onclick = () => {
    autoMic = !autoMic;
    $('autoBtn').textContent = '🔁 Auto Mic: ' + (autoMic ? 'ON' : 'OFF');
    $('autoBtn').classList.toggle('on', autoMic);
    if (autoMic) listen();
  };

  /* Settings Modal Wiring */
  const settingsModal = $('settingsModal');
  if ($('settingsBtn')) {
    $('settingsBtn').onclick = () => {
      $('groqKeyInput').value = localStorage.getItem('jarvis_groq_key') || (GROQ_API_KEY.includes('PASTE_YOUR') ? '' : GROQ_API_KEY);
      $('geminiKeyInput').value = localStorage.getItem('jarvis_gemini_key') || (GEMINI_API_KEY.includes('PASTE_YOUR') ? '' : GEMINI_API_KEY);
      if (settingsModal) settingsModal.style.display = 'flex';
    };
  }
  if ($('closeSettingsBtn')) $('closeSettingsBtn').onclick = () => { if (settingsModal) settingsModal.style.display = 'none'; };
  if ($('saveSettingsBtn')) {
    $('saveSettingsBtn').onclick = () => {
      const gKey = $('groqKeyInput').value.trim();
      const gemKey = $('geminiKeyInput').value.trim();
      if (gKey) localStorage.setItem('jarvis_groq_key', gKey); else localStorage.removeItem('jarvis_groq_key');
      if (gemKey) localStorage.setItem('jarvis_gemini_key', gemKey); else localStorage.removeItem('jarvis_gemini_key');
      if (settingsModal) settingsModal.style.display = 'none';
      if (hasAnyKey()) $('reply').textContent = 'API Key save ho gayi, Boss. Systems fully online!';
      else $('reply').textContent = 'Boss, pehle API Key set karo.';
    };
  }

  if ($('clearBtn')) $('clearBtn').onclick = () => { chatHistory = []; $('heard').textContent = ''; say('Memory reset ho gayi, Boss.'); };

  if (!hasAnyKey()) $('reply').textContent = 'Boss, pehle neeche 🔑 API Keys button dabakar key daalo.';
});

/* ---------------- PWA Service Worker & Install Prompt ---------------- */
let deferredPrompt = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered!', reg))
      .catch(err => console.error('Service Worker Registration Failed!', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = $('installBtn');
  if (installBtn) installBtn.style.display = 'inline-block';
});

if ($('installBtn')) {
  $('installBtn').addEventListener('click', () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted PWA install');
        }
        deferredPrompt = null;
        $('installBtn').style.display = 'none';
      });
    }
  });
}
